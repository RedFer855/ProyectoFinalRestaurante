[versions]
agp = "9.2.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
activityKtx = "1.13.0"
drawerlayout = "1.2.0"
swiperefreshlayout = "1.2.0"
constraintlayout = "2.2.1"
retrofit = "2.11.0"
lifecycle = "2.8.7"
desugarJdkLibs = "2.1.4"
coreTesting = "2.2.0"
# 4.16.0 es la ultima estable en Maven Central (5.0.0 sigue en release candidate).
glide = "4.16.0"
exifinterface = "1.4.2"
# Verificadas contra Google Maven el 2026-08-01: room release = 2.8.4;
# workManager estable mas alta = 2.11.2 (2.12.0-beta01 es beta y no se usa).
room = "2.8.4"
workManager = "2.11.2"
# Robolectric 4.16.1 es la ultima estable en Maven Central (2026-01). Soporta API 23-36;
# el targetSdk del proyecto (37) todavia no, por eso los tests anotan @Config(sdk = 35).
robolectric = "4.16.1"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "coreTesting" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
drawerlayout = { group = "androidx.drawerlayout", name = "drawerlayout", version.ref = "drawerlayout" }
swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
# ProcessLifecycleOwner: mismo tren de versiones que el resto de lifecycle-*, verificado
# contra Google Maven (dl.google.com/android/maven2) el 2026-08-04 — 2.8.7 existe ahí.
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "workManager" }
# Mismo tren que work-runtime (2.11.2, verificado contra Google Maven). Permite inspeccionar
# el WorkManager real (no un mock) desde un test Robolectric.
work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

